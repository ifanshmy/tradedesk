name: Keep the API awake

# Render's free plan puts the API to sleep after ~15 idle minutes, and the next visitor waits 30-60 s.
# A light health check every 10 minutes keeps it warm. (Public repo: Actions minutes are free.)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 70 https://tradedesk-api-ax5n.onrender.com/api/health) || code=000
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::API did not answer with 200"
